services:
  - type: web
    name: bridgecraft
    runtime: docker
    # Video processing and hosted Craft sessions need more than the free plan's
    # 512 MB; move to a paid instance (about 2 GB) before promoting them publicly.
    # Craft sessions live in memory, so keep a single instance.
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PUBLIC_BASE_URL
        value: https://bridgecraft.onrender.com
      # OAuth (Auth0 or Clerk). See README "ArtCraft Studio".
      - key: OAUTH_ISSUER
        sync: false
      # The audience is fixed in the connector at
      # https://connect.getartcraft.com/mcp. OAUTH_AUDIENCE is not read.
      # Retention is 7 days after the session ends. Any other value is ignored.
      - key: STUDIO_FILE_RETENTION_DAYS
        value: "7"
      # Encrypts the exchanged ArtCraft token. Generate with
      # python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
      - key: GRANT_KEY
        sync: false
      # S3-compatible storage for user files (Backblaze B2 shown; R2_* also works).
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_BUCKET
        sync: false
